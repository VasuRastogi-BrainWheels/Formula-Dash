
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formula Dash</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
	<style>
    /*Mobile*/
    @media(max-width: 1023px){
body {
  touch-action: none;
    background-color: black;
    cursor: hidden;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    margin: 0;
    overflow: hidden; /* Prevents scrollbars during rotation */
}	
		canvas { 
            position: absolute;
            width:100vh;
            height:100vw;
            border: none; 
            transform: rotate(90deg);
        		top: 23.4%;
        		left: -44.5%;
        		background: transparent;
        		
           }

    #ui{                     
        filter: brightness(1) contrast(1);
        max-height: 710px;    
        top: 23.4%;
        left: -44.5%;
        border:12px solid black;
           
           }
    #background {
      z-index: -1;
    }
    #monitor{
     
      position: absolute;
      left:40%;
      top:70%;
      width:180px;
      height:160px;
      

    }
    speed{
      position: absolute;
      top:82%;
      left:30%;
      font-size:30px;
      color:orange;
      font-weight: bolder;
      transform: rotate(90deg);
    }
    fps{
      position: absolute;
      top:8%;
      left:80%;
      
      font-size:30px;
      color:white;
      transform: rotate(90deg);
    }
}
/* Desktop  */
@media(min-width: 400px)  {
    [hoverable]{ 
       cursor:url("images/Pointer.png") 0 0, pointer;

    }
    [hoverable]:hover{ 
       cursor:url("images/Pointer.png") 0 0, pointer;
       transform:scale(1.12);
    }
    body {
    touch-action: none;
    background-color: black;
    
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    margin: 0;
    overflow: hidden; 
} 
    canvas{
      background: transparent;
       cursor:url("images/Cursor.png") 0 0, auto;
    }

    #background {
      z-index: -2;
      position: absolute;
      filter:brightness(1.0);
      top:0%;
      left:0%;
      height:100%;
      width:100%;
    }
    #monitor{
     
      position: absolute;
      left:76%;
      top:5%;
      

    }
    #debugger{
      position: absolute;
      top:4%;
      left:8%;
      font-size:20px;
      color:black;
      color:lime;
      opacity:0.8;
    }
    fps{
      position: absolute;
      top:4%;
      left:4%;
      font-size:60px;
      color:white;
    }
}
	</style>
</head>
<body>
  <img hidden src='models/Roads/New/citybits_texture2.png'>  
	<div id="renderer"></div>
	<canvas id="background"></canvas>
	<canvas stye="z-index:122 ; "id="ui"></canvas>

  
  <fps hoverable>0</fps>
  <dialog  id="debugger" open>Debugger</dialog>
  <canvas  id='monitor' hoverable></canvas>
  <script type="importmap">
{
  "imports": {
    "Siger": "https://cdn.jsdelivr.net/gh/VasuRastogi-BrainWheel/Siger@master/Siger.js"
  }
}
</script>
	<script type="module" src="main.js"></script>
	<script type="module"  src="GameCtrl.js"></script>
</body>
</html>
